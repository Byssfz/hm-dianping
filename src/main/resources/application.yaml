server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13306/hmdp?useSSL=false&serverTimezone=UTC&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 16379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
rocketmq:
  producer:
    group: hm-seckill-producer-group
  name-server: 127.0.0.1:9876

# 智能客服模型配置（支持 Chat Completions + Tool Calls 的模型服务）
customer-service:
  ai:
    enabled: ${CUSTOMER_SERVICE_AI_ENABLED:true}
    endpoint: ${CUSTOMER_SERVICE_AI_ENDPOINT:https://api.deepseek.com/chat/completions}
    model: ${CUSTOMER_SERVICE_AI_MODEL:deepseek-flash}
    # 在 IDEA 启动配置或系统环境变量中设置真实 Key，不要写入本文件。
    api-key: ${CUSTOMER_SERVICE_AI_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
