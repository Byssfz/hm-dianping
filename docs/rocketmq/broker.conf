# Broker address returned to the Java application running on the Docker host.
brokerIP1=127.0.0.1
brokerClusterName=HmdpCluster
brokerName=hmdp-broker
brokerId=0
listenPort=10911
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# Explicitly created by the init-topic Compose service.
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=true
defaultTopicQueueNums=4

storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
mapedFileSizeCommitLog=134217728
fileReservedTime=48
deleteWhen=04
